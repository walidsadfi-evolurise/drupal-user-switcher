name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find . \( -name '*.php' -o -name '*.module' -o -name '*.install' \) -print0 | xargs -0 -n1 php -l
